[tool.poetry]
name = "qwenbotq"
version = "0.1.0"
description = "A smart QQ bot based on Nonebot2 and Onebot v11."
authors = ["originalFactor"]
license = "MIT"
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.10, <3.14"
nonebot2 = "^2.4.2"
nonebot-adapter-onebot = "^2.4.6"
motor = "^3.7.1"
beanie = "2.1.0"
aiohttp = "^3.11.16"
nonebot-plugin-apscheduler = "^0.5.0"
aiodns = ">=3.2,<5.0"
openai = "^2.6.1"
truststore = "^0.10.4"
mem0ai = ">=1.0.3,<3.0.0"
nonebot-plugin-alconna = ">=0.53.0"
picimagesearch = "^3.12.11"
py7zr = "^1.1.0"
ehentaix = "^0.1.3"
pytimeparse2 = "^1.7.1"

[tool.poetry.group.dev.dependencies]
nb-cli = "^1.4.2"
hypothesis = "^6.0.0"
pytest = ">=8,<10"
black = "^26.1.0"


[[tool.poetry.source]]
name = "mirrors"
url = "https://pypi.tuna.tsinghua.edu.cn/simple/"
priority = "primary"


[[tool.poetry.source]]
name = "PyPI"
priority = "supplemental"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

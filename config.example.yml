# QwenBotQ 配置文件示例
# 复制本文件为 config.yml 并填入实际值

# ============ AI 大模型配置 ============
ai:
  # API 接口列表（可配置多个）
  apis:
    my_api:
      token: sk-your-api-token-here
      base: https://api.example.com/v1

  # 模型列表（引用上方 api_id）
  models:
    my-model:
      api_id: my_api          # 对应 apis 中的 key
      name: My Model           # 模型显示名称（默认 "Unknown"）
      # context_length: 8192   # 上下文长度（可选）
      # max_tokens: 4096       # 最大输出 token 数（可选）
      # detail: ""             # 模型描述（可选）

  # 默认提示词配置
  default_prompts:
    # default 提示词（内置默认值：你是我的人工智能助手，请根据我的要求提供帮助。）
    # default:
    #   prompt: "你是我的人工智能助手，请根据我的要求提供帮助。"
    #   temperature: 1.0
    #   frequency_penalty: 0.0
    #   presence_penalty: 0.0
    #   max_tokens: 2048

    # unsafe 提示词（可选，用于特殊场景）
    # unsafe:
    #   prompt: "你的自定义提示词"
    #   temperature: 1.0
    #   frequency_penalty: 1.0
    #   presence_penalty: 1.0
    #   max_tokens: 2048

  # 工具配置
  tools:
    bocha:
      token: sk-your-bocha-token-here
      # endpoint: https://api.bocha.cn/v1/web-search  # 默认值

  # 记忆（RAG）配置（可选）
  memory:
    llm:
      api_id: my_api
      model: my-model
    embedder:
      api_id: my_api
      model: text-embedding-3-small
      dimensions: 1536
    # reranker:                # 重排序模型（可选）
    #   api_id: my_api
    #   model: BAAI/bge-reranker-v2-m3
    # threshold: 0.8           # 记忆匹配阈值（默认 0.8）

# ============ 数据库配置 ============
database:
  uri: mongodb://user:password@127.0.0.1:27017/
  # name: aioBot              # 数据库名（默认 "aioBot"）

